<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>alder</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header id="topbar">
    <div class="brand">alder</div>
    <div id="path" class="path"></div>
    <div class="spacer"></div>
    <button id="run-all" class="btn primary" title="Run all cells">Run all</button>
    <button id="stop" class="btn danger" title="Stop the running cell" disabled>Stop</button>
    <button id="app-mode" class="btn" title="Toggle app mode (hide code)">App mode</button>
    <button id="save" class="btn" title="Save notebook to disk">Save</button>
  </header>

  <div id="status" role="status" aria-live="polite"></div>

  <main id="notebook"></main>

  <template id="cell-tpl">
    <section class="cell">
      <div class="cell-head">
        <span class="badge"></span>
        <span class="cell-actions">
          <button data-act="run" class="btn mini primary" title="Run cell">Run</button>
          <button data-act="add-below" class="btn mini" title="Add code cell below">+ code</button>
          <button data-act="delete" class="btn mini" title="Delete cell">&#10005;</button>
        </span>
      </div>
      <div class="code-area" hidden>
        <textarea class="code" spellcheck="false"></textarea>
      </div>
      <div class="md-area" hidden>
        <textarea class="md" spellcheck="false" placeholder="# Markdown cell"></textarea>
      </div>
      <div class="output-area">
        <div class="widgets" hidden></div>
        <div class="value"></div>
      </div>
      <div class="log"></div>
    </section>
  </template>

  <script src="/static/app.js"></script>
</body>
</html>
