name: Patched Ark and native producers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  produce:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
          - target: win32-x64
            runner: windows-2025
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: host/.node-version
          cache: npm
          cache-dependency-path: host/package-lock.json

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.95.0

      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true

      - name: Verify pinned Rust inputs
        shell: bash
        run: |
          test "$(rustc --version | cut -d' ' -f2)" = "1.95.0"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://static.rust-lang.org/dist/channel-rust-1.95.0.toml -o /tmp/channel-rust.toml
          if [[ '${{ runner.os }}' == 'macOS' ]]; then
            printf '%s  /tmp/channel-rust.toml\n' \
              821ff14e4c4a1cbe1e8915f35aff0a3fbbdf8d293ad48ab8f31e3b0440c581f9 \
              | shasum -a 256 -c -
          else
            printf '%s  /tmp/channel-rust.toml\n' \
              821ff14e4c4a1cbe1e8915f35aff0a3fbbdf8d293ad48ab8f31e3b0440c581f9 \
              | sha256sum -c -
          fi

      - name: Produce patched Ark and provenance
        shell: bash
        run: |
          node host/scripts/build-ark.mjs --target '${{ matrix.target }}'

      - name: Produce native containment helper
        shell: bash
        run: |
          cargo build --locked --release --manifest-path host/native/process-supervisor/Cargo.toml

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alder-runtimes-${{ matrix.target }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            host/.runtime/ark-build/${{ matrix.target }}/*.tar.gz
            host/.runtime/ark-build/${{ matrix.target }}/ark-artifact.json
            host/native/process-supervisor/target/release/alder-process-supervisor*
